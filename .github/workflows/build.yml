# Compile check for work branches (main releases through release.yml).
name: Build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Jellyfin package versions
        run: curl -s https://api.nuget.org/v3-flatcontainer/jellyfin.controller/index.json | tr -d '\n ' | tail -c 400 | sed 's/^/::warning::versions /'
      - name: Build
        run: |
          set -o pipefail
          dotnet build Jellyfin.Plugin.VideoStore.csproj -c Release -o out 2>&1 | tee build.log || { grep -E "error|NU1" build.log | sort -u | head -15 | sed 's/^/::error::/'; exit 1; }
